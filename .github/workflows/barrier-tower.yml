name: Barrier Tower Replay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Resolve pinned Mathlib release
        run: lake update

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Verify historical byte provenance and escape surface
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          sha = lambda b: hashlib.sha256(b).hexdigest()
          root = Path('barrier-tower/theorems')
          files = sorted(root.glob('*.lean'))
          idx = json.loads(Path('barrier-tower/INDEX.json').read_text(encoding='utf-8'))

          assert idx['sealed_count'] == 27
          assert idx['unclean'] == []
          assert len(files) == 27
          assert len(idx['artifacts']) == 27

          indexed = {}
          for a in idx['artifacts']:
              name = a['lean'].replace('\\', '/').rsplit('/', 1)[-1]
              indexed[name] = a
          assert set(indexed) == {p.name for p in files}

          exact = 0
          crlf_restored = 0
          for p in files:
              data = p.read_bytes()
              want = indexed[p.name]['sha256']
              if sha(data) == want:
                  exact += 1
              else:
                  lf = data.replace(b'\r\n', b'\n')
                  restored = lf.replace(b'\n', b'\r\n')
                  assert sha(restored) == want, f'content drift beyond line endings: {p.name}'
                  crlf_restored += 1

              text = data.decode('utf-8-sig')
              lines = text.splitlines()
              assert not [i+1 for i,l in enumerate(lines) if re.fullmatch(r'\s*sorry\s*', l)], p.name
              assert not [i+1 for i,l in enumerate(lines) if re.match(r'^\s*axiom\s+', l)], p.name
              assert not [i+1 for i,l in enumerate(lines) if re.match(r'^\s*unsafe\s+', l)], p.name

          print(f'PASS: 27/27 files preserve INDEX content: exact={exact}, CRLF-restored={crlf_restored}')
          print('GitHub migration changed line endings only; historical SHA-256 is recovered deterministically.')
          PY

      - name: Compile all 27 sealed theorem files
        run: |
          set -euo pipefail
          count=0
          for f in barrier-tower/theorems/*.lean; do
            echo "=== $f ==="
            lake env lean "$f"
            count=$((count + 1))
          done
          test "$count" -eq 27
          echo "PASS: compiled $count sealed theorem files"
